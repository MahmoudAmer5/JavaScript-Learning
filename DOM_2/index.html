<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        main{
            background-color: blue;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 10px;
            margin: 10px;
        }
        div{
            background-color: aqua;
            border: 3px solid;
            border-radius: 20px;
            padding: 10px;
        }
        div button{
            display: inline-block ;
            margin: 10px;
        }
        .scrollBtn{
            position: fixed;
            height: 40px;
            width: 40px;
            border-radius: 20px;
            font-size: 10px;
            bottom: 20px;
            right: 50vw;
            cursor: pointer;
            display: none; /* Hidden initially */
        }
        .NewProductbtn{
            border-radius: 10px;
            font-size: 10px;
            top : 30px;
            right: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="newProduct">
        <form>
            <label for="newProductTitle">Product Title</label>
            <input type="text" name="newProductTitle" id="newProductTitle" required placeholder="Enter the Product Name">
            <label for="newProductDescription">Product Description</label>
            <input type="text" name="newProductDescription" id="newProductDescription" placeholder="Enter The Description">
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
